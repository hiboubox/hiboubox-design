<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80" aria-label="ALSACE">
  <ellipse cx="70" cy="40" rx="66" ry="36" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <ellipse cx="70" cy="40" rx="60" ry="30" fill="none" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 2.4" opacity="0.55"/>
  <rect x="30" y="23" width="80" height="16" fill="none" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2.6 2" opacity="0.95"/>
  <text x="70" y="34.5" text-anchor="middle" font-family="'Special Elite','Courier New',monospace,serif" font-size="12" letter-spacing="0.4" fill="currentColor" font-weight="700">ALSACE</text>
  <g transform="translate(70 55) scale(0.78)">
    <!-- stork : body + long beak + legs -->
    <ellipse cx="-3" cy="-2" rx="3" ry="2" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <!-- head -->
    <circle cx="-6" cy="-4" r="1.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <!-- beak -->
    <path d="M-7 -4 L-10 -3.5 L-7 -3" fill="none" stroke="currentColor" stroke-width="0.6"/>
    <!-- legs -->
    <line x1="-3" y1="0" x2="-4" y2="6" stroke="currentColor" stroke-width="0.7"/>
    <line x1="-2" y1="0" x2="-1" y2="6" stroke="currentColor" stroke-width="0.7"/>
    <line x1="-5" y1="6" x2="-3" y2="6" stroke="currentColor" stroke-width="0.6"/>
    <line x1="-2" y1="6" x2="0" y2="6" stroke="currentColor" stroke-width="0.6"/>
    <!-- wing -->
    <path d="M-3 -3 Q0 -5 0 -1 Z" fill="none" stroke="currentColor" stroke-width="0.7"/>
    <!-- grape cluster -->
    <g opacity="0.85">
      <circle cx="6" cy="0" r="1.1" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <circle cx="8" cy="1.5" r="1.1" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <circle cx="4" cy="1.5" r="1.1" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <circle cx="7" cy="3.5" r="1.1" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <circle cx="5" cy="3.5" r="1.1" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <circle cx="6" cy="5.5" r="1.1" fill="none" stroke="currentColor" stroke-width="0.6"/>
    </g>
    
  </g>
  <circle cx="10" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
  <circle cx="130" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
</svg>
