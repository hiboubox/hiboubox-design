    <circle cx="0" cy="-9" r="0.6" fill="currentColor"/>
    <!-- grape -->
    <g opacity="0.85">
      <circle cx="8" cy="3" r="0.9" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <circle cx="10" cy="4.5" r="0.9" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <circle cx="9" cy="6" r="0.9" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <circle cx="7" cy="5" r="0.9" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <line x1="8" y1="3" x2="8" y2="1.5" stroke="currentColor" stroke-width="0.5"/>
    </g>
    
  </g>
  <circle cx="10" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
  <circle cx="130" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
