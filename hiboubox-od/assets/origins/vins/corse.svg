<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80" aria-label="CORSE">
  <ellipse cx="70" cy="40" rx="66" ry="36" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <ellipse cx="70" cy="40" rx="60" ry="30" fill="none" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 2.4" opacity="0.55"/>
  <rect x="30" y="23" width="80" height="16" fill="none" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2.6 2" opacity="0.95"/>
  <text x="70" y="34.5" text-anchor="middle" font-family="'Special Elite','Courier New',monospace,serif" font-size="13" letter-spacing="0.4" fill="currentColor" font-weight="700">CORSE</text>
  <g transform="translate(70 55) scale(0.78)">
    <!-- genoese tower (cylindrical base + crenellated top) -->
    <rect x="-4" y="-3" width="8" height="9" fill="none" stroke="currentColor" stroke-width="0.9"/>
    <rect x="-5" y="-6" width="10" height="3" fill="none" stroke="currentColor" stroke-width="0.9"/>
    <!-- crenelations -->
    <path d="M-5 -6 L-5 -8 L-4 -8 L-4 -6 M-2 -6 L-2 -8 L-1 -8 L-1 -6 M1 -6 L1 -8 L2 -8 L2 -6 M4 -6 L4 -8 L5 -8 L5 -6" fill="none" stroke="currentColor" stroke-width="0.7"/>
    <!-- window -->
    <rect x="-1" y="0" width="2" height="3" fill="none" stroke="currentColor" stroke-width="0.6"/>
    <!-- sea waves -->
    <path d="M-11 8 Q-8 6.5 -5 8 T1 8 T7 8 T12 8" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.6"/>
    
  </g>
  <circle cx="10" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
  <circle cx="130" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
</svg>
