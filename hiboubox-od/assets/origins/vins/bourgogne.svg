<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80" aria-label="BOURGOGNE">
  <ellipse cx="70" cy="40" rx="66" ry="36" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <ellipse cx="70" cy="40" rx="60" ry="30" fill="none" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 2.4" opacity="0.55"/>
  <rect x="30" y="23" width="80" height="16" fill="none" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2.6 2" opacity="0.95"/>
  <text x="70" y="34.5" text-anchor="middle" font-family="'Special Elite','Courier New',monospace,serif" font-size="10" letter-spacing="0.4" fill="currentColor" font-weight="700">BOURGOGNE</text>
  <g transform="translate(70 55) scale(0.78)">
    <!-- barrel oval body -->
    <ellipse cx="0" cy="2" rx="11" ry="7" fill="none" stroke="currentColor" stroke-width="0.9"/>
    <!-- staves -->
    <line x1="-7" y1="-4" x2="-7" y2="8" stroke="currentColor" stroke-width="0.6"/>
    <line x1="-3.5" y1="-5" x2="-3.5" y2="9" stroke="currentColor" stroke-width="0.6"/>
    <line x1="0" y1="-5" x2="0" y2="9" stroke="currentColor" stroke-width="0.6"/>
    <line x1="3.5" y1="-5" x2="3.5" y2="9" stroke="currentColor" stroke-width="0.6"/>
    <line x1="7" y1="-4" x2="7" y2="8" stroke="currentColor" stroke-width="0.6"/>
    <!-- iron rings -->
    <line x1="-11" y1="-1" x2="11" y2="-1" stroke="currentColor" stroke-width="0.9"/>
    <line x1="-11" y1="5" x2="11" y2="5" stroke="currentColor" stroke-width="0.9"/>
    
  </g>
  <circle cx="10" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
  <circle cx="130" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
</svg>
