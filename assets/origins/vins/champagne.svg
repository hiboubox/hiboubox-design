<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80" aria-label="CHAMPAGNE">
  <ellipse cx="70" cy="40" rx="66" ry="36" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <ellipse cx="70" cy="40" rx="60" ry="30" fill="none" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 2.4" opacity="0.55"/>
  <rect x="30" y="23" width="80" height="16" fill="none" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2.6 2" opacity="0.95"/>
  <text x="70" y="34.5" text-anchor="middle" font-family="'Special Elite','Courier New',monospace,serif" font-size="10" letter-spacing="0.4" fill="currentColor" font-weight="700">CHAMPAGNE</text>
  <g transform="translate(70 55) scale(0.78)">
    <!-- flute glass : trapezoid bowl, stem, foot -->
    <path d="M-4 -7 L-2 4 L2 4 L4 -7 Z" fill="none" stroke="currentColor" stroke-width="0.9"/>
    <line x1="0" y1="4" x2="0" y2="9" stroke="currentColor" stroke-width="0.9"/>
    <line x1="-4" y1="9" x2="4" y2="9" stroke="currentColor" stroke-width="0.9"/>
    <!-- liquid level -->
    <line x1="-3" y1="-2" x2="3" y2="-2" stroke="currentColor" stroke-width="0.7" opacity="0.7"/>
    <!-- bubbles rising -->
    <circle cx="-1.5" cy="0" r="0.7" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.7"/>
    <circle cx="1" cy="-3" r="0.6" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.7"/>
    <circle cx="-0.5" cy="-5" r="0.7" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.7"/>
    <circle cx="0" cy="2" r="0.5" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.6"/>
    
  </g>
  <circle cx="10" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
  <circle cx="130" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
</svg>
