<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80" aria-label="BEAUJOLAIS">
  <ellipse cx="70" cy="40" rx="66" ry="36" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <ellipse cx="70" cy="40" rx="60" ry="30" fill="none" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 2.4" opacity="0.55"/>
  <rect x="30" y="23" width="80" height="16" fill="none" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2.6 2" opacity="0.95"/>
  <text x="70" y="34.5" text-anchor="middle" font-family="'Special Elite','Courier New',monospace,serif" font-size="9" letter-spacing="0.4" fill="currentColor" font-weight="700">BEAUJOLAIS</text>
  <g transform="translate(70 55) scale(0.78)">
    <!-- rolling hills -->
    <path d="M-12 6 Q-7 0 -2 4 Q3 8 8 2 Q11 -1 12 4 L12 9 L-12 9 Z" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <!-- sun -->
    <circle cx="-4" cy="-4" r="2" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <g stroke="currentColor" stroke-width="0.6">
      <line x1="-4" y1="-9" x2="-4" y2="-7"/>
      <line x1="-9" y1="-4" x2="-7" y2="-4"/>
      <line x1="-7.5" y1="-7.5" x2="-6.5" y2="-6.5"/>
      <line x1="-1.5" y1="-7.5" x2="-2.5" y2="-6.5"/>
    </g>
    <!-- vine row : 3 small grape dots -->
    <g opacity="0.7">
      <circle cx="5" cy="-1" r="0.8" fill="currentColor"/>
      <circle cx="7" cy="-2" r="0.8" fill="currentColor"/>
      <circle cx="3" cy="-2" r="0.8" fill="currentColor"/>
    </g>
    
  </g>
  <circle cx="10" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
  <circle cx="130" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
</svg>
