<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80" aria-label="LOIRE">
  <ellipse cx="70" cy="40" rx="66" ry="36" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <ellipse cx="70" cy="40" rx="60" ry="30" fill="none" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 2.4" opacity="0.55"/>
  <rect x="30" y="23" width="80" height="16" fill="none" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2.6 2" opacity="0.95"/>
  <text x="70" y="34.5" text-anchor="middle" font-family="'Special Elite','Courier New',monospace,serif" font-size="13" letter-spacing="0.4" fill="currentColor" font-weight="700">LOIRE</text>
  <g transform="translate(70 55) scale(0.78)">
    <!-- castle main body -->
    <rect x="-7" y="-2" width="14" height="6" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <!-- twin towers with conical roofs -->
    <rect x="-9" y="-5" width="3" height="9" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <rect x="6" y="-5" width="3" height="9" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <path d="M-9 -5 L-7.5 -8 L-6 -5" fill="none" stroke="currentColor" stroke-width="0.7"/>
    <path d="M6 -5 L7.5 -8 L9 -5" fill="none" stroke="currentColor" stroke-width="0.7"/>
    <!-- arched door -->
    <path d="M-1.5 4 L-1.5 1 Q0 -0.5 1.5 1 L1.5 4" fill="none" stroke="currentColor" stroke-width="0.7"/>
    <!-- river -->
    <path d="M-11 8 Q-6 6 -2 8 T7 8 T11 9" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.7"/>
    
  </g>
  <circle cx="10" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
  <circle cx="130" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
</svg>
