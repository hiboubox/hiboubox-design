<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80" aria-label="ROUSSILLON">
  <ellipse cx="70" cy="40" rx="66" ry="36" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <ellipse cx="70" cy="40" rx="60" ry="30" fill="none" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 2.4" opacity="0.55"/>
  <rect x="30" y="23" width="80" height="16" fill="none" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2.6 2" opacity="0.95"/>
  <text x="70" y="34.5" text-anchor="middle" font-family="'Special Elite','Courier New',monospace,serif" font-size="9" letter-spacing="0.4" fill="currentColor" font-weight="700">ROUSSILLON</text>
  <g transform="translate(70 55) scale(0.78)">
    <!-- palm trunk -->
    <path d="M-0.5 8 Q-1.5 4 -1 0 L1 0 Q1.5 4 0.5 8 Z" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <!-- palm fronds (8 leaves radiating) -->
    <g stroke="currentColor" stroke-width="0.7" fill="none">
      <path d="M0 -1 Q-4 -3 -8 -2"/>
      <path d="M0 -1 Q-3 -5 -7 -6"/>
      <path d="M0 -1 Q-1 -5 -3 -8"/>
      <path d="M0 -1 Q1 -5 3 -8"/>
      <path d="M0 -1 Q3 -5 7 -6"/>
      <path d="M0 -1 Q4 -3 8 -2"/>
      <path d="M0 -1 Q-2 -3 -5 -4.5"/>
      <path d="M0 -1 Q2 -3 5 -4.5"/>
    </g>
    <!-- date cluster -->
    <circle cx="0" cy="-1" r="0.6" fill="currentColor" opacity="0.7"/>
    <!-- grape side -->
    <g opacity="0.7">
      <circle cx="-7" cy="5" r="0.7" fill="currentColor"/>
      <circle cx="-8" cy="6.5" r="0.7" fill="currentColor"/>
      <circle cx="-6" cy="6.5" r="0.7" fill="currentColor"/>
      <circle cx="7" cy="5" r="0.7" fill="currentColor"/>
      <circle cx="8" cy="6.5" r="0.7" fill="currentColor"/>
      <circle cx="6" cy="6.5" r="0.7" fill="currentColor"/>
    </g>
    
  </g>
  <circle cx="10" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
  <circle cx="130" cy="40" r="1.2" fill="currentColor" opacity="0.6"/>
</svg>
